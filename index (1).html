<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UA Terminal — Mobile Gaming Acquisition Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --bg:#0B0E11; --surface:#14181D; --surface2:#1B2026; --border:#262C33; --text:#E6EAEF;
  --dim:#8A94A0; --faint:#525C68; --accent:#C6F24E; --pos:#3DD68C; --neg:#FF5C6C; --warn:#FFB454; --grid:#21272E;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --on-accent:#0B0E11;
}
.light{
  --bg:#F4F6F8; --surface:#fff; --surface2:#F0F2F5; --border:#E2E6EB; --text:#0F1620;
  --dim:#5B6573; --faint:#9AA4B0; --accent:#4F8F12; --pos:#0E8F5C; --neg:#D32F45; --warn:#B26A00; --grid:#ECEFF2; --on-accent:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
button{font-family:inherit}
.mono{font-family:var(--mono)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.hdr{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border)}
.row{display:flex;align-items:center;gap:10px}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--faint)}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;background:transparent;color:var(--dim);padding:7px 12px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg.ghost button.on{background:var(--surface2);color:var(--text)}
.tab{display:flex;align-items:center;gap:6px;padding:11px 14px;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
.title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--dim);font-weight:500;padding:8px 12px}
td{padding:8px 12px}
tr.hl td{background:var(--surface2)}
.tag{font-size:9px;padding:2px 6px;border-radius:4px;letter-spacing:.3px}
.ms{position:relative}
.ms-menu{position:absolute;top:110%;left:0;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:200px;max-height:300px;overflow:auto;box-shadow:0 14px 44px rgba(0,0,0,.4)}
.ms-menu label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px}
.ms-menu label:hover{background:var(--surface2)}
.grid{display:grid;gap:14px}
.kpi{font-family:var(--mono);font-size:22px}
.muted{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.chart{width:100%;height:280px}
.pill{padding:2px 7px;border-radius:5px}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;justify-content:flex-end}
.drawer-body{width:min(720px,96vw);height:100%;background:var(--bg);border-left:1px solid var(--border);overflow:auto}
.banner{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--dim)}
a{color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================================
   UA TERMINAL — self-contained dashboard.
   Runs on built-in demo data by default. To use live Adjust data, deploy the
   serverless proxy (see README) and set CONFIG.apiBase below to its URL.
   ========================================================================= */
const CONFIG = {
  // null            -> built-in demo data (shareable immediately)
  // "/api/adjust"   -> the proxy deployed alongside this site (same origin, no CORS)
  // full URL        -> a proxy on a different host, e.g. "https://other.vercel.app/api/adjust"
  apiBase: "/api/adjust",
};

/* ---------------- constants ---------------- */
const PERIODS=[0,1,2,3,7,14,21,30,60,90];
const pIdx=p=>PERIODS.indexOf(p);
const DAYS=60;
const APPS=["Galaxy Raiders","Merge Kingdom","Puzzle Dash"];
const OSES=["android","ios"];
const NETWORKS=["Google Ads","Meta","Unity","AppLovin","Mintegral","Liftoff","IronSource"];
const COUNTRIES=[
 {code:"US",name:"United States",region:"NA"},{code:"CA",name:"Canada",region:"NA"},
 {code:"GB",name:"United Kingdom",region:"EMEA"},{code:"DE",name:"Germany",region:"EMEA"},
 {code:"FR",name:"France",region:"EMEA"},{code:"JP",name:"Japan",region:"APAC"},
 {code:"KR",name:"South Korea",region:"APAC"},{code:"BR",name:"Brazil",region:"LATAM"}];
const isGoogle=n=>/google|adwords/i.test(n);
const SERIES_D=["#C6F24E","#5AC8FA","#FF8FA3","#FFB454","#A78BFA","#3DD68C","#FF5C6C"];
const SERIES_L=["#4F8F12","#0A84C8","#D6336C","#B26A00","#7C4DDB","#0E8F5C","#D32F45"];

/* ---------------- deterministic PRNG ---------------- */
function mulberry32(a){return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
let rnd=mulberry32(20260531);
const pick=a=>a[Math.floor(rnd()*a.length)];
const jit=(m,p)=>m*(1+(rnd()-0.5)*2*p);

/* ---------------- dates ---------------- */
const TODAY=new Date("2026-05-30T00:00:00Z");
const isoDay=d=>d.toISOString().slice(0,10);
const ALL_DATES=Array.from({length:DAYS},(_,i)=>isoDay(new Date(TODAY.getTime()-(DAYS-1-i)*864e5)));
function weekKey(iso){const d=new Date(iso+"T00:00:00Z");const dow=(d.getUTCDay()+6)%7;return isoDay(new Date(d.getTime()-dow*864e5));}
const monthKey=iso=>iso.slice(0,7);
const bucketOf=(iso,g)=>g==="week"?weekKey(iso):g==="month"?monthKey(iso):iso;
function bucketDates(dates,g){if(g==="week")return[...new Set(dates.map(weekKey))];if(g==="month")return[...new Set(dates.map(monthKey))];return dates;}

/* ---------------- demo data generation ---------------- */
function buildUnits(){
  const units=[];let uid=0;
  const themes=["Hook","Gameplay","UGC","Reward","Boss","Tutorial","Meta","Holiday"];
  for(const app of APPS)for(const os of OSES)for(const net of NETWORKS){
    if(rnd()<0.32)continue;
    const nC=1+Math.floor(rnd()*2);
    for(let c=0;c<nC;c++){
      const obj=pick(["UAC","ROAS","Installs","Reengage","Tier1","LATAM"]);
      const campaign=app.split(" ")[0]+"_"+os.toUpperCase()+"_"+obj+"_"+(c+1);
      const nA=1+Math.floor(rnd()*2);
      for(let g=0;g<nA;g++){
        const adgroup="AG_"+pick(["Lookalike","Broad","Interest","Retarget","Tier1"])+"_"+(g+1);
        const nK=1+Math.floor(rnd()*2);
        for(let k=0;k<nK;k++){
          const goog=isGoogle(net);const theme=pick(themes);
          const craw=goog?"":"cr_"+theme+"_"+os+"_"+(k+1);
          units.push({id:uid++,app,os,network:net,campaign,adgroup,
            creativeResolved:goog?adgroup:craw,
            source:goog&&!craw?"adgroup_fallback":"native",
            quality:0.55+rnd()*0.9,ctrBase:jit(0.018+rnd()*0.03,0.1),
            cvrBase:jit(0.16+rnd()*0.18,0.1),cpiBase:jit(0.7+rnd()*2.4,0.1),
            fatigue:rnd()<0.22,cpiCreep:rnd()<0.2,scale:200+rnd()*2600,
            countries:COUNTRIES.filter(()=>rnd()<0.45).slice(0,4)});
        }
      }
    }
  }
  for(const u of units)if(u.countries.length<2)u.countries=COUNTRIES.slice(0,2+Math.floor(rnd()*2));
  return units;
}
function buildDemo(){
  rnd=mulberry32(20260531);
  const units=buildUnits();const delivery=[];const cohorts=[];
  const cMult={US:1,CA:.6,GB:.7,DE:.65,FR:.5,JP:.55,KR:.5,BR:.4};
  const cRoas={US:1.15,CA:1,GB:1,DE:.95,FR:.85,JP:1.25,KR:1.1,BR:.6};
  for(const u of units)for(const ct of u.countries){
    for(let i=0;i<DAYS;i++){
      const iso=ALL_DATES[i],t=i/(DAYS-1);
      const season=1+0.15*Math.sin((i/7)*Math.PI);
      const imp=Math.round(u.scale*(cMult[ct.code]||.5)*season*jit(1,.18));
      if(imp<20)continue;
      const ctr=Math.max(.003,u.ctrBase*(u.fatigue?1-0.4*t:1)*jit(1,.12));
      const clicks=Math.round(imp*ctr);
      const cvr=Math.max(.02,u.cvrBase*jit(1,.12));
      const installs=Math.round(clicks*cvr);if(installs<=0)continue;
      const cpi=u.cpiBase*(u.cpiCreep?1+0.5*t:1)*jit(1,.1);
      const spend=+(installs*cpi).toFixed(2);
      delivery.push({date:iso,unitId:u.id,country:ct.code,impressions:imp,clicks,installs,spend});
      const maturity=Math.round((TODAY-new Date(iso+"T00:00:00Z"))/864e5);
      const arpu=(0.9+u.quality*2.4)*(cRoas[ct.code]||.9)*jit(1,.15);
      const rev=PERIODS.map(p=>{if(p>maturity)return null;const frac=1-Math.exp(-p/26);return +(installs*arpu*Math.max(p===0?0.12:frac,0)).toFixed(2);});
      const ret=PERIODS.map(p=>{if(p>maturity)return null;if(p===0)return installs;return Math.round(installs*Math.exp(-p/(12+u.quality*18)));});
      cohorts.push({date:iso,unitId:u.id,country:ct.code,cohortSize:installs,spend,rev,ret});
    }
  }
  return {units,delivery,cohorts};
}

/* ---------------- data source (demo or live proxy) ---------------- */
let DATA=null, UNIT={};
async function loadData(from,to){
  if(!CONFIG.apiBase){ DATA=buildDemo(); }
  else{
    const r=await fetch(CONFIG.apiBase+"?from="+from+"&to="+to);
    if(!r.ok) throw new Error("Proxy error "+r.status);
    DATA=await r.json(); // expected: {units:[...], delivery:[...], cohorts:[...]}
  }
  UNIT=Object.fromEntries(DATA.units.map(u=>[u.id,u]));
}

/* ---------------- metric engine (aggregate-then-divide) ---------------- */
function matchUnit(u,f){
  if(f.apps.length&&!f.apps.includes(u.app))return false;
  if(f.os.length&&!f.os.includes(u.os))return false;
  if(f.networks.length&&!f.networks.includes(u.network))return false;
  if(f.campaigns.length&&!f.campaigns.includes(u.campaign))return false;
  if(f.creatives.length&&!f.creatives.includes(u.creativeResolved))return false;
  return true;
}
const inCtry=(c,f)=>!f.countries.length||f.countries.includes(c);
function filterDelivery(f,o){const lo=o?.from??f.dateFrom,hi=o?.to??f.dateTo;return DATA.delivery.filter(r=>r.date>=lo&&r.date<=hi&&inCtry(r.country,f)&&matchUnit(UNIT[r.unitId],f));}
function filterCohorts(f,o){const lo=o?.from??f.dateFrom,hi=o?.to??f.dateTo;return DATA.cohorts.filter(r=>r.date>=lo&&r.date<=hi&&inCtry(r.country,f)&&matchUnit(UNIT[r.unitId],f));}
function sumD(rows){const a={impressions:0,clicks:0,installs:0,spend:0};for(const r of rows){a.impressions+=r.impressions;a.clicks+=r.clicks;a.installs+=r.installs;a.spend+=r.spend;}return a;}
function rates(a){return{...a,
  ctr:a.impressions?a.clicks/a.impressions:null,
  cvr:a.clicks?a.installs/a.clicks:null,
  cpi:a.installs?a.spend/a.installs:null,
  ipm:a.impressions?a.installs/a.impressions*1000:null,
  ecpm:a.impressions?a.spend/a.impressions*1000:null};}
function roll(rows){
  const o=PERIODS.map(()=>({rev:0,ret:0,size:0,spend:0,mature:true,has:false}));
  for(const r of rows)PERIODS.forEach((p,j)=>{if(r.rev[j]==null){o[j].mature=false;return;}o[j].rev+=r.rev[j];o[j].ret+=r.ret[j]||0;o[j].size+=r.cohortSize;o[j].spend+=r.spend;o[j].has=true;});
  return o.map(x=>({...x,roas:x.spend?x.rev/x.spend:null,ltv:x.size?x.rev/x.size:null,retention:x.size?x.ret/x.size:null}));
}
const roasAt=(R,p)=>R[pIdx(p)]?.roas??null, ltvAt=(R,p)=>R[pIdx(p)]?.ltv??null, retAt=(R,p)=>R[pIdx(p)]?.retention??null;
function trend(s){const y=s.filter(v=>v!=null),n=y.length;if(n<3)return"flat";let sx=0,sy=0,sxy=0,sxx=0;y.forEach((v,i)=>{sx+=i;sy+=v;sxy+=i*v;sxx+=i*i;});const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx||1),mean=sy/n||1,norm=slope*n/(Math.abs(mean)||1);return norm>.08?"up":norm<-.08?"down":"flat";}
function groupBy(f,keyFn){
  const rd=filterDelivery(f),rc=filterCohorts(f),m=new Map();
  const ens=k=>{if(!m.has(k))m.set(k,{key:k,d:[],c:[]});return m.get(k);};
  for(const r of rd)ens(keyFn(UNIT[r.unitId],r)).d.push(r);
  for(const r of rc)ens(keyFn(UNIT[r.unitId],r)).c.push(r);
  return[...m.values()].map(g=>{const d=rates(sumD(g.d)),R=roll(g.c);
    return{key:g.key,...d,roll:R,roas7:roasAt(R,7),roas30:roasAt(R,30),ltv7:ltvAt(R,7),ret1:retAt(R,1),ret7:retAt(R,7),rowsD:g.d};});
}
function seriesBy(rows,g,fn){const bs=bucketDates(ALL_DATES,g).filter(b=>rows.some(r=>bucketOf(r.date,g)===b));return bs.map(b=>fn(rows.filter(r=>bucketOf(r.date,g)===b),b));}

/* ---------------- formatters ---------------- */
const f$=v=>v==null?"—":"$"+Math.round(v).toLocaleString();
const f$2=v=>v==null?"—":"$"+(+v).toFixed(2);
const fNum=v=>v==null?"—":Math.round(v).toLocaleString();
const fPct=v=>v==null?"—":(v*100).toFixed(1)+"%";
const fRoas=v=>v==null?"—":(+v).toFixed(2)+"×";
const fDelta=v=>v==null?"—":(v>=0?"+":"")+(v*100).toFixed(1)+"%";
function colorScale(v,lo,hi){if(v==null)return"var(--surface2)";const t=Math.max(0,Math.min(1,(v-lo)/(hi-lo||1)));
  const neg=[255,92,108],mid=[120,130,140],pos=[61,214,140],lp=(a,b,k)=>a.map((x,i)=>Math.round(x+(b[i]-x)*k));
  const c=t<.5?lp(neg,mid,t*2):lp(mid,pos,(t-.5)*2);return"rgba("+c[0]+","+c[1]+","+c[2]+","+(0.18+0.55*Math.abs(t-.5)*2)+")";}

/* ---------------- state ---------------- */
const S={dark:true,tab:"overview",range:30,gran:"day",
  sel:{apps:[],os:[],networks:[],campaigns:[],creatives:[],countries:[]},
  compare:false,sortKey:"spend",chosen:[],cmpMetric:"roas7",
  creSel:null,geoMetric:"roas7",cohCurve:"roas",cohDim:"country",
  cmpType:"creative",cmpItems:[]};
function curF(){const to=ALL_DATES[ALL_DATES.length-1];const from=ALL_DATES[Math.max(0,ALL_DATES.length-S.range)];return{...S.sel,dateFrom:from,dateTo:to};}
function TS(){return S.dark?SERIES_D:SERIES_L;}
function ic(name,col){ // tiny inline icon set
  const p={activity:'M3 12h4l3 8 4-16 3 8h4',target:'M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0',
   image:'M3 4h18v16H3zM8 11l2 2 3-4 4 6H6z',globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M3 12h18M12 3c3 4 3 14 0 18M12 3c-3 4-3 14 0 18',
   radio:'M12 12m-2 0a2 2 0 104 0a2 2 0 10-4 0M8 8a6 6 0 000 8M16 8a6 6 0 010 8M5 5a10 10 0 000 14M19 5a10 10 0 010 14',
   git:'M6 3v12a3 3 0 003 3h6M6 6m-3 0a3 3 0 106 0a3 3 0 10-6 0M18 18m-3 0a3 3 0 106 0a3 3 0 10-6 0',
   zap:'M13 2 4 14h7l-1 8 9-12h-7z',up:'M3 17l6-6 4 4 8-8M21 7v6h-6',down:'M3 7l6 6 4-4 8 8M21 17v-6h-6',
   cmp:'M9 3v18M15 3v18M3 9h6M15 9h6M3 15h6M15 15h6',sun:'M12 4v2M12 18v2M4 12h2M18 12h2M6 6l1 1M17 17l1 1M6 18l1-1M17 7l1-1M12 8a4 4 0 100 8 4 4 0 000-8',
   moon:'M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z',db:'M12 3c5 0 8 1.5 8 3.5S17 10 12 10 4 8.5 4 6.5 7 3 12 3M4 6.5v11C4 19.5 7 21 12 21s8-1.5 8-3.5v-11',
   trophy:'M8 4h8v4a4 4 0 11-8 0zM6 4H4v2a3 3 0 003 3M18 4h2v2a3 3 0 01-3 3M10 14h4v4h-4zM8 20h8',
   flame:'M12 3c1 4 4 5 4 9a4 4 0 11-8 0c0-2 1-3 2-4 0 2 2 2 2-5z',layers:'M12 3l9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5',
   x:'M5 5l14 14M19 5L5 19',warn:'M12 3l9 16H3zM12 9v5M12 17v.5',down2:'M12 5v14M5 12l7 7 7-7'};
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="'+(col||'currentColor')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+(p[name]||'')+'"/></svg>';
}
function trendBadge(dir){const m={up:['var(--pos)','up'],down:['var(--neg)','down'],flat:['var(--dim)','activity']};const[col,n]=m[dir]||m.flat;return '<span style="color:'+col+'">'+ic(n,col)+'</span>';}
function deltaHTML(v,inv){if(v==null)return '<span style="color:var(--dim)">—</span>';const good=inv?v<0:v>0;const col=v===0?'var(--dim)':good?'var(--pos)':'var(--neg)';return '<span class="mono" style="color:'+col+';font-size:12px">'+fDelta(v)+'</span>';}

/* ---------------- multiselect ---------------- */
function msHTML(id,label,opts,val){
  const sum=val.length===0?"All":val.length===1?val[0]:val.length+" selected";
  let m='<div class="ms" data-ms="'+id+'"><button class="btn" data-msbtn="'+id+'" style="min-width:120px">'+
    '<span class="muted" style="font-size:10px">'+label+'</span>'+
    '<span style="margin-left:auto;color:'+(val.length?'var(--accent)':'var(--text)')+';font-weight:500">'+sum+'</span>'+ic('down')+'</button>';
  return m+'</div>';
}
function openMenu(id,opts,val,onChange){
  closeMenus();
  const wrap=document.querySelector('[data-ms="'+id+'"]');if(!wrap)return;
  const menu=document.createElement('div');menu.className='ms-menu';menu.dataset.menu=id;
  if(!opts.length)menu.innerHTML='<div style="padding:8px;color:var(--dim);font-size:12px">No options</div>';
  opts.forEach(o=>{const l=document.createElement('label');const ck=val.includes(o)?'checked':'';
    l.innerHTML='<input type="checkbox" '+ck+' style="accent-color:var(--accent)"><span style="white-space:nowrap">'+o+'</span>';
    l.querySelector('input').onclick=()=>{const nv=val.includes(o)?val.filter(x=>x!==o):[...val,o];onChange(nv);};
    menu.appendChild(l);});
  if(val.length){const b=document.createElement('button');b.className='btn';b.style.width='100%';b.style.marginTop='4px';b.textContent='Clear';b.onclick=()=>onChange([]);menu.appendChild(b);}
  wrap.appendChild(menu);
}
function closeMenus(){document.querySelectorAll('[data-menu]').forEach(m=>m.remove());}
document.addEventListener('click',e=>{if(!e.target.closest('.ms'))closeMenus();});

/* ---------------- cascading options ---------------- */
function options(){
  const us=DATA.units.filter(u=>matchUnit(u,{...S.sel,campaigns:[],creatives:[]}));
  return{apps:APPS,os:OSES,networks:NETWORKS,
    campaigns:[...new Set(us.map(u=>u.campaign))].sort(),
    creatives:[...new Set(us.map(u=>u.creativeResolved))].sort(),
    countries:COUNTRIES.map(c=>c.code)};
}

/* ---------------- chart helper ---------------- */
const charts={};
function chart(id,option){
  const elx=document.getElementById(id);if(!elx)return;
  if(charts[id]){charts[id].dispose();}
  const c=echarts.init(elx,null,{renderer:'canvas'});
  c.setOption(option);charts[id]=c;
}
function axisBase(){const dim=cssv('--dim'),grid=cssv('--grid');return{
  textStyle:{fontFamily:"'IBM Plex Mono',monospace"},
  grid:{left:48,right:20,top:24,bottom:34},
  tooltip:{trigger:'axis',backgroundColor:cssv('--surface'),borderColor:cssv('--border'),textStyle:{color:cssv('--text'),fontSize:12}},
  xAxis:{type:'category',axisLine:{lineStyle:{color:grid}},axisLabel:{color:dim,fontSize:10},splitLine:{show:false}},
  yAxis:{type:'value',axisLine:{show:false},axisLabel:{color:dim,fontSize:10},splitLine:{lineStyle:{color:grid}}}};
}
function cssv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

/* =========================================================================
   RENDER
   ========================================================================= */
function render(){
  document.documentElement.className=S.dark?'':'light';

     '<button class="btn" data-act="theme" style="width:34px;height:34px;justify-content:center">'+ic(S.dark?'sun':'moon')+'</button></div>';

  h+='<div class="row" style="flex-wrap:wrap;gap:8px;padding:10px 20px;border-top:1px solid var(--border)">';
  h+='<div class="seg">'+[7,14,30,60].map(d=>'<button class="'+(S.range===d?'on':'')+'" data-range="'+d+'">'+d+'d</button>').join('')+'</div>';
  h+='<div class="seg ghost">'+[["day","D"],["week","W"],["month","M"]].map(([g,l])=>'<button class="'+(S.gran===g?'on':'')+'" data-gran="'+g+'">'+l+'</button>').join('')+'</div>';
  h+='<span class="mono" style="font-size:11px;color:var(--dim)">'+f.dateFrom+' → '+f.dateTo+'</span>';

     msHTML('campaigns','Campaign',opts.campaigns,S.sel.campaigns)+msHTML('creatives','Creative',opts.creatives,S.sel.creatives)+msHTML('countries','Country',opts.countries,S.sel.countries);

  h+='<div id="body" style="padding:20px;max-width:1400px;margin:0 auto"></div>';
  document.getElementById('app').innerHTML=h;

function wireHeader(opts){
  document.querySelector('[data-act="theme"]').onclick=()=>{S.dark=!S.dark;render();};
  document.querySelector('[data-act="compare"]').onclick=()=>{S.compare=true;render();};
  const rb=document.querySelector('[data-act="reset"]');if(rb)rb.onclick=()=>{S.sel={apps:[],os:[],networks:[],campaigns:[],creatives:[],countries:[]};render();};
  document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{S.range=+b.dataset.range;render();});
  document.querySelectorAll('[data-gran]').forEach(b=>b.onclick=()=>{S.gran=b.dataset.gran;render();});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
  const msmap={apps:opts.apps,os:opts.os,networks:opts.networks,campaigns:opts.campaigns,creatives:opts.creatives,countries:opts.countries};
  Object.keys(msmap).forEach(id=>{
    const btn=document.querySelector('[data-msbtn="'+id+'"]');if(!btn)return;
    btn.onclick=e=>{e.stopPropagation();
      const exists=document.querySelector('[data-menu="'+id+'"]');closeMenus();if(exists)return;
      openMenu(id,msmap[id],S.sel[id],nv=>{S.sel[id]=nv;render();setTimeout(()=>{document.querySelector('[data-msbtn="'+id+'"]')?.click();},0);});};
  });
}

function renderBody(){
  const f=curF();
  ({overview:tabOverview,campaigns:tabCampaigns,creatives:tabCreatives,geo:tabGeo,channels:tabChannels,cohorts:tabCohorts,insights:tabInsights}[S.tab])(f);
}

/* ---------------- TAB: OVERVIEW ---------------- */
function trendSeries(f,g,fn){const bs=bucketDates(ALL_DATES.filter(d=>d>=f.dateFrom&&d<=f.dateTo),g);const rd=filterDelivery(f),rc=filterCohorts(f);
  return bs.map(b=>fn(sumD(rd.filter(r=>bucketOf(r.date,g)===b)),roll(rc.filter(r=>bucketOf(r.date,g)===b))));}
function tabOverview(f){
  const cur=rates(sumD(filterDelivery(f))),R=roll(filterCohorts(f));
  const to=f.dateTo,w7=ALL_DATES[Math.max(0,ALL_DATES.indexOf(to)-6)],pTo=ALL_DATES[Math.max(0,ALL_DATES.indexOf(w7)-1)],pF=ALL_DATES[Math.max(0,ALL_DATES.indexOf(pTo)-6)];
  const l7=rates(sumD(filterDelivery(f,{from:w7,to}))),p7=rates(sumD(filterDelivery(f,{from:pF,to:pTo})));
  const r7=roll(filterCohorts(f,{from:w7,to})),pp7=roll(filterCohorts(f,{from:pF,to:pTo}));
  const wow=(a,b)=>b?(a-b)/b:null;
  const g=S.gran;
  const sSpend=trendSeries(f,g,d=>d.spend),sRev=trendSeries(f,g,(_,c)=>c[pIdx(7)].rev),sInst=trendSeries(f,g,d=>d.installs),
    sCtr=trendSeries(f,g,d=>d.impressions?d.clicks/d.impressions:null),sCpi=trendSeries(f,g,d=>d.installs?d.spend/d.installs:null),
    sCvr=trendSeries(f,g,d=>d.clicks?d.installs/d.clicks:null),sRet=trendSeries(f,g,(_,c)=>c[pIdx(7)].retention),
    sRoas=sSpend.map((s,i)=>s?(sRev[i]||0)/s:null);
  const bs=bucketDates(ALL_DATES.filter(d=>d>=f.dateFrom&&d<=f.dateTo),g);
  const cards=[
    ["Spend",f$(cur.spend),sSpend,wow(l7.spend,p7.spend),false,"WoW"],
    ["Revenue (D7)",f$(R[pIdx(7)].rev),sRev,wow(r7[pIdx(7)].rev,pp7[pIdx(7)].rev),false,"WoW"],
    ["Installs",fNum(cur.installs),sInst,wow(l7.installs,p7.installs),false,"WoW"],
    ["D7 ROAS",fRoas(roasAt(R,7)),sRoas,wow(roasAt(r7,7),roasAt(pp7,7)),false,(R[pIdx(7)].mature?"100":"74")+"% mature"],
    ["CPI",f$2(cur.cpi),sCpi,wow(l7.cpi,p7.cpi),true,"WoW"],
    ["CTR",fPct(cur.ctr),sCtr,wow(l7.ctr,p7.ctr),false,"WoW"],
    ["CVR (CCR)",fPct(cur.cvr),sCvr,wow(l7.cvr,p7.cvr),false,"WoW"],
    ["D7 Retention",fPct(retAt(R,7)),sRet,wow(retAt(r7,7),retAt(pp7,7)),false,"WoW"]];
  let h='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">';
  cards.forEach((c,i)=>{h+='<div class="card" style="padding:14px"><div class="muted">'+c[0]+'</div>'+
    '<div class="row" style="justify-content:space-between;align-items:baseline;margin-top:4px"><span class="kpi">'+c[1]+'</span>'+trendBadge(trend(c[2]))+'</div>'+
    '<div id="spk'+i+'" style="height:32px;margin:6px 0 2px"></div>'+
    '<div class="row" style="justify-content:space-between">'+deltaHTML(c[3],c[4])+'<span style="font-size:10px;color:var(--dim)">'+c[5]+'</span></div></div>';});
  h+='</div>';
  h+='<div class="grid" style="grid-template-columns:1.4fr 1fr;margin-top:14px">'+
     '<div class="card"><div class="title">'+ic('up','var(--accent)')+'Spend vs Revenue · 7d rolling avg</div><div id="ovTrend" class="chart"></div></div>'+
     '<div class="card"><div class="title">'+ic('activity','var(--accent)')+'Daily ROAS (D7)</div><div id="ovRoas" class="chart"></div></div></div>';
  // period strip
  const strip=[["Spend",f$(l7.spend),wow(l7.spend,p7.spend),false],["Installs",fNum(l7.installs),wow(l7.installs,p7.installs),false],
    ["CPI",f$2(l7.cpi),wow(l7.cpi,p7.cpi),true],["CTR",fPct(l7.ctr),wow(l7.ctr,p7.ctr),false],["CVR",fPct(l7.cvr),wow(l7.cvr,p7.cvr),false],["D7 ROAS",fRoas(roasAt(r7,7)),wow(roasAt(r7,7),roasAt(pp7,7)),false]];
  h+='<div class="card" style="margin-top:14px"><div class="title">'+ic('cmp','var(--accent)')+'Period comparison · current vs prior 7 days</div>'+
     '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+
     strip.map(s=>'<div style="background:var(--surface2);border-radius:8px;padding:10px"><div class="muted">'+s[0]+'</div><div class="mono" style="font-size:17px">'+s[1]+'</div>'+deltaHTML(s[2],s[3])+'</div>').join('')+'</div></div>';
  document.getElementById('body').innerHTML=h;
  // sparklines
  cards.forEach((c,i)=>chart('spk'+i,{grid:{left:2,right:2,top:4,bottom:4},xAxis:{type:'category',show:false,data:c[2].map((_,j)=>j)},yAxis:{type:'value',show:true,axisLabel:{show:false},splitLine:{show:false},axisLine:{show:false},axisTick:{show:false}},series:[{type:'line',data:c[2].map(v=>v==null?null:+v.toFixed(4)),smooth:true,symbol:'none',lineStyle:{width:1.6,color:TS()[i%7]}}]}));
  const ab=axisBase();
  chart('ovTrend',{...ab,legend:{show:true,top:0,right:0,textStyle:{color:cssv('--dim'),fontSize:10},data:['Revenue','Spend','Spend 7d']},
    xAxis:{...ab.xAxis,data:bs.map(b=>b.slice(5))},
    yAxis:{...ab.yAxis,axisLabel:{...ab.yAxis.axisLabel,formatter:v=>'$'+(v/1000).toFixed(0)+'k'}},
    series:[{name:'Revenue',type:'line',areaStyle:{opacity:.12},symbol:'none',smooth:true,data:sRev.map(v=>v==null?null:Math.round(v)),lineStyle:{color:TS()[1],width:2},itemStyle:{color:TS()[1]}},
      {name:'Spend',type:'line',symbol:'none',smooth:true,data:sSpend.map(v=>Math.round(v)),lineStyle:{color:TS()[0],width:2},itemStyle:{color:TS()[0]}},
      {name:'Spend 7d',type:'line',symbol:'none',smooth:true,data:rollingAvg(sSpend).map(v=>v==null?null:Math.round(v)),lineStyle:{color:cssv('--dim'),width:1.4,type:'dashed'},itemStyle:{color:cssv('--dim')}}]});
  chart('ovRoas',{...ab,legend:{show:false},
    xAxis:{...ab.xAxis,data:bs.map(b=>b.slice(5))},
    yAxis:[{...ab.yAxis,axisLabel:{...ab.yAxis.axisLabel,formatter:v=>'$'+(v/1000).toFixed(0)+'k'}},{type:'value',axisLabel:{color:cssv('--dim'),fontSize:10,formatter:v=>v.toFixed(1)+'×'},splitLine:{show:false}}],
    series:[{name:'Spend',type:'bar',data:sSpend.map(v=>Math.round(v)),itemStyle:{color:TS()[0],opacity:.55}},
      {name:'ROAS',type:'line',yAxisIndex:1,symbol:'none',smooth:true,data:sRoas.map(v=>v==null?null:+v.toFixed(3)),lineStyle:{color:TS()[2],width:2},markLine:{silent:true,symbol:'none',data:[{yAxis:1}],lineStyle:{color:cssv('--warn'),type:'dashed'}}}]});
}
function rollingAvg(arr,w){w=w||7;return arr.map((_,i)=>{const s=arr.slice(Math.max(0,i-w+1),i+1).filter(v=>v!=null);return s.length?s.reduce((a,b)=>a+b,0)/s.length:null;});}

  const head={spend:"Spend",installs:"Installs",cpi:"CPI",ctr:"CTR",cvr:"CVR",roas7:"D7 ROAS",roas30:"D30 ROAS"};
  const fmt={spend:f$,installs:fNum,cpi:f$2,ctr:fPct,cvr:fPct,roas7:fRoas,roas30:fRoas};
  const picks=S.chosen.length?S.chosen:sorted.slice(0,4).map(r=>r.key);

/* ---------------- TAB: INSIGHTS ---------------- */
function tabInsights(f){
  const list=genInsights(f);
  const icn={cpi:'warn',ctr:'up',win:'trophy',fatigue:'flame',roas:'down',ret:'down'};
  let h='<div style="font-size:12px;color:var(--dim);margin-bottom:8px">'+list.length+' signals · ranked by spend at stake × severity</div>';
  if(!list.length)h+='<div class="card"><div style="color:var(--dim);font-size:13px">No significant signals — widen the date range or clear filters.</div></div>';
  list.forEach(ins=>{const col=ins.tone==='good'?'var(--pos)':ins.tone==='bad'?'var(--neg)':'var(--warn)';
    h+='<div class="card" style="padding:14px;border-left:3px solid '+col+';margin-bottom:10px"><div class="row" style="gap:12px"><span style="color:'+col+'">'+ic(icn[ins.kind]||'zap',col)+'</span><div><div style="font-size:13.5px">'+ins.text+'</div><div style="font-size:11px;color:var(--dim);margin-top:2px">'+ins.context+'</div></div></div></div>';});
  document.getElementById('body').innerHTML=h;
}
function genInsights(f){
  const to=f.dateTo,w7=ALL_DATES[Math.max(0,ALL_DATES.indexOf(to)-6)],pTo=ALL_DATES[Math.max(0,ALL_DATES.indexOf(w7)-1)],pF=ALL_DATES[Math.max(0,ALL_DATES.indexOf(pTo)-6)];
  const out=[];const byC=new Map();
  for(const r of DATA.delivery){const u=UNIT[r.unitId];if(!matchUnit(u,f)||!inCtry(r.country,f))continue;if(!byC.has(u.campaign))byC.set(u.campaign,{cur:[],prev:[]});
    if(r.date>=w7&&r.date<=to)byC.get(u.campaign).cur.push(r);else if(r.date>=pF&&r.date<=pTo)byC.get(u.campaign).prev.push(r);}
  for(const[k,v]of byC){const cur=rates(sumD(v.cur)),prev=rates(sumD(v.prev));if(cur.spend<300||prev.installs<5)continue;
    if(cur.cpi&&prev.cpi){const ch=(cur.cpi-prev.cpi)/prev.cpi;if(ch>.18)out.push({kind:'cpi',tone:'bad',weight:cur.spend*ch,text:'Campaign "'+k+'" CPI increased '+(ch*100).toFixed(0)+'% over the last 7 days',context:'CPI '+f$2(prev.cpi)+' → '+f$2(cur.cpi)+' · spend '+f$(cur.spend)});}
    if(cur.ctr&&prev.ctr){const ch=(cur.ctr-prev.ctr)/prev.ctr;if(ch>.15)out.push({kind:'ctr',tone:'good',weight:cur.spend*ch,text:'Campaign "'+k+'" CTR increased '+(ch*100).toFixed(0)+'% WoW',context:'CTR '+fPct(prev.ctr)+' → '+fPct(cur.ctr)});}}
  let bg=null;for(const ct of COUNTRIES){if(f.countries.length&&!f.countries.includes(ct.code))continue;const R=roll(filterCohorts({...f,countries:[ct.code]},{from:w7,to}));const r=roasAt(R,7),sp=R[pIdx(7)].spend;if(r!=null&&sp>200&&(!bg||r>bg.r))bg={name:ct.name,r};}
  if(bg)out.push({kind:'win',tone:'good',weight:1e6,text:'Country "'+bg.name+'" achieved the highest D7 ROAS ('+fRoas(bg.r)+')',context:'Best-performing geography this period'});
  const cre=groupBy(f,u=>u.creativeResolved).filter(r=>r.spend>200&&r.roas7!=null).sort((a,b)=>b.roas7-a.roas7)[0];
  if(cre)out.push({kind:'win',tone:'good',weight:9e5,text:'Creative "'+cre.key+'" is the top ROAS performer ('+fRoas(cre.roas7)+')',context:'Spend '+f$(cre.spend)+' · CTR '+fPct(cre.ctr)});
  const fat=groupBy(f,u=>u.creativeResolved).filter(r=>r.spend>300).map(r=>{const s=seriesBy(r.rowsD,'day',rr=>{const x=sumD(rr);return x.impressions?x.clicks/x.impressions:null;});return{...r,dir:trend(s)};}).filter(r=>r.dir==='down').sort((a,b)=>b.spend-a.spend)[0];
  if(fat)out.push({kind:'fatigue',tone:'bad',weight:fat.spend,text:'Creative "'+fat.key+'" shows fatigue — CTR trending down',context:'Spend at risk '+f$(fat.spend)+' · consider refresh'});
  return out.sort((a,b)=>b.weight-a.weight).slice(0,12);
}

/* ---------------- COMPARISON DRAWER ---------------- */
function renderDrawer(){

  const opts=type==='country'?COUNTRIES.map(c=>c.code):[...new Set(DATA.units.filter(u=>matchUnit(u,f)).map(u=>keyFn[type](u)))].sort();
  const compute=item=>{let ff={...f};if(type==='country')ff={...f,countries:[item]};else if(type==='creative')ff={...f,creatives:[item]};else if(type==='campaign')ff={...f,campaigns:[item]};else ff={...f,apps:[item]};
    const d=rates(sumD(filterDelivery(ff))),R=roll(filterCohorts(ff));return{item,spend:d.spend,installs:d.installs,cpi:d.cpi,ctr:d.ctr,cvr:d.cvr,roas7:roasAt(R,7),roas30:roasAt(R,30),ltv7:ltvAt(R,7),ret7:retAt(R,7)};};

  h+=msHTML('cmp','Pick '+type+'s',opts,S.cmpItems);

  else{h+='<div class="card" style="padding:0"><table><thead><tr><th style="text-align:left">Metric</th>'+data.map((d,i)=>'<th style="text-align:right;color:'+TS()[i%7]+'">'+d.item+(i===0?' (base)':'')+'</th>').join('')+'</tr></thead><tbody>';
    metrics.forEach(([l,k,fmt,inv])=>{h+='<tr style="border-top:1px solid var(--border)"><td style="color:var(--dim)">'+l+'</td>'+data.map((d,i)=>{const v=d[k],bv=base[k],diff=i>0&&v!=null&&bv?(v-bv)/bv:null,good=diff==null?null:(inv?diff<0:diff>0);
      return '<td style="text-align:right" class="mono"><div>'+fmt(v)+'</div>'+(i>0&&diff!=null?'<div style="font-size:10.5px;color:'+(good?'var(--pos)':'var(--neg)')+'">'+fDelta(diff)+'</div>':'')+'</td>';}).join('')+'</tr>';});

  h+='</div></div></div>';
  document.getElementById('app').insertAdjacentHTML('beforeend',h);

  dr.onclick=e=>{if(!e.target.closest('[data-stop]')){S.compare=false;render();}};
  dr.querySelector('[data-act="closeCmp"]').onclick=()=>{S.compare=false;render();};
  dr.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{S.cmpType=b.dataset.ct;S.cmpItems=[];render();});
  const btn=dr.querySelector('[data-msbtn="cmp"]');
  if(btn)btn.onclick=e=>{e.stopPropagation();const ex=dr.querySelector('[data-menu="cmp"]');closeMenus();if(ex)return;openMenu('cmp',opts,S.cmpItems,nv=>{S.cmpItems=nv.slice(0,4);render();});};
}

/* ---------------- CSV export ---------------- */
function exportCSV(name,cols,rows){try{
  const head=cols.map(c=>'"'+c[0]+'"').join(',');
  const body=rows.map(r=>cols.map(c=>{const v=c[1](r);return '"'+(v==null?'':(''+v).replace(/"/g,'""'))+'"';}).join(',')).join('\n');
  const blob=new Blob([head+'\n'+body],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);
}catch(e){console.error(e);}}

/* ---------------- init ---------------- */
window.addEventListener('resize',()=>Object.values(charts).forEach(c=>c&&c.resize()));
function errorScreen(msg){
  const url=(CONFIG.apiBase||'')+'?from='+curF().dateFrom+'&to='+curF().dateTo;
  document.getElementById('app').innerHTML=
   '<div style="max-width:680px;margin:60px auto;padding:0 20px;font-family:IBM Plex Sans,sans-serif">'+
   '<div class="card" style="border-left:3px solid var(--neg)">'+
   '<div style="font-family:Sora;font-weight:700;font-size:18px;margin-bottom:8px">Live data did not load</div>'+
   '<div style="color:var(--dim);font-size:13px;margin-bottom:12px">The dashboard is set to use the proxy at <span class="mono" style="color:var(--text)">'+CONFIG.apiBase+'</span> but the request failed:</div>'+
   '<pre class="mono" style="background:var(--surface2);padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;color:var(--neg)">'+msg+'</pre>'+
   '<div style="color:var(--dim);font-size:12.5px;margin-top:12px">Test the proxy directly: <a href="'+url+'" target="_blank">'+url+'</a></div>'+
   '<ul style="color:var(--dim);font-size:12.5px;line-height:1.7">'+
   '<li>"ADJUST_API_TOKEN not configured" → add it in Vercel → Settings → Environment Variables, then redeploy.</li>'+
   '<li>404 → the function isn\'t at <span class="mono">/api/adjust.js</span>.</li>'+
   '<li>502 / timeout → narrow the date range (try 7d) and verify the Adjust metric slugs.</li>'+
   '</ul>'+
   '<button class="btn" id="useDemo" style="margin-top:8px">Load demo data instead</button>'+
   '</div></div>';
  document.getElementById('useDemo').onclick=async()=>{CONFIG.apiBase=null;await loadData(curF().dateFrom,curF().dateTo);render();};
}
(async function(){
  const f=curF();
  try{ await loadData(f.dateFrom,f.dateTo); render(); }
  catch(e){ errorScreen(String(e.message||e)); }
})();
</script>
